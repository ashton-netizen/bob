<title>BOB Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: BOB's own approved brand (near-black canvas, white, orange #F75821; Bebas Neue headlines, Instrument Sans body). The buddy bar speaks first, then the map, then the plain-words detail for whatever you tap. */
:root {
  --bg: #0f0f0f; --surface: #181818; --fg: #ffffff; --muted: #a9a9a9; --line: #2d2d2d;
  --orange: #f75821; --orange-soft: #3a1a0f;
  --proven: #5ec27f; --built: #f2c14e; --todo: #8a8a8a;
  --head: "Bebas Neue", "Arial Narrow", Arial, sans-serif;
  --body: "Instrument Sans", Arial, system-ui, sans-serif;
}
:root:not([data-theme="dark"]) { }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #ffffff; --surface: #f4f3f1; --fg: #0f0f0f; --muted: #5d5d5d; --line: #dcdad6;
  --orange-soft: #fde6dc; --proven: #1f7a46; --built: #a06a00; --todo: #6d6d6d; color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #ffffff; --surface: #f4f3f1; --fg: #0f0f0f; --muted: #5d5d5d; --line: #dcdad6;
  --orange-soft: #fde6dc; --proven: #1f7a46; --built: #a06a00; --todo: #6d6d6d; color-scheme: light; }
:root { color-scheme: dark; }

body { background: var(--bg); color: var(--fg); font: 16px/1.55 var(--body); }
.wrap { max-width: 1060px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.lockup { display: block; width: min(360px, 80%); height: auto; }
.lockup.on-light { display: none; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .lockup.on-dark { display: none; } :root:not([data-theme="dark"]) .lockup.on-light { display: block; } }
:root[data-theme="light"] .lockup.on-dark { display: none; } :root[data-theme="light"] .lockup.on-light { display: block; }
.tag { display: inline-block; margin: 14px 0 0; font: 400 15px/1 var(--head); letter-spacing: .1em; color: var(--orange); border: 1px solid var(--orange); border-radius: 4px; padding: 6px 9px; }

.buddy { display: grid; grid-template-columns: 96px 1fr; gap: 18px; align-items: center; margin-top: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.buddy img { width: 96px; height: 96px; object-fit: contain; }
.buddy h1 { font: 400 clamp(28px, 4.4vw, 40px)/1.05 var(--head); letter-spacing: .02em; margin: 0 0 6px; }
.buddy p { margin: 0 0 4px; max-width: 62ch; }
.buddy .you { color: var(--muted); font-size: 14px; }
.buddy b { color: var(--orange); font-weight: 600; }
@media (max-width: 520px) { .buddy { grid-template-columns: 64px 1fr; } .buddy img { width: 64px; height: 64px; } }

.stage { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; }
.stage span { font: 400 15px/1 var(--head); letter-spacing: .08em; padding: 8px 11px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
.stage .done { color: var(--bg); background: var(--proven); border-color: var(--proven); }
.stage .now { color: #fff; background: var(--orange); border-color: var(--orange); }

h2 { font: 400 28px/1 var(--head); letter-spacing: .04em; margin: 40px 0 6px; }
.sub { color: var(--muted); margin: 0 0 14px; max-width: 64ch; }
.mapbox { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px; overflow: hidden; }
svg { display: block; width: 100%; height: auto; }
svg text { font-family: var(--body); fill: var(--fg); }
.hub rect { fill: var(--bg); stroke: var(--line); stroke-width: 1.5; }
.hub text { font-size: 15px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
.hub .count { font-size: 11px; font-weight: 500; fill: var(--muted); }
.hub.sel rect { stroke: var(--orange); stroke-width: 3; }
.hub, .leaf { cursor: pointer; }
.hub:focus-visible rect, .leaf:focus-visible circle { outline: 2px solid var(--orange); }
.edge { stroke: var(--line); stroke-width: 1.5; fill: none; }
.leaf circle { stroke-width: 2.5; }
.leaf.proven circle { fill: var(--proven); stroke: var(--proven); }
.leaf.built circle { fill: var(--bg); stroke: var(--built); }
.leaf.built path { fill: var(--built); }
.leaf.todo circle { fill: var(--bg); stroke: var(--todo); stroke-dasharray: 4 3; }
.leaf.sel circle { stroke: var(--orange); stroke-width: 4; }
.leaf .tick { stroke: var(--bg); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.legend { display: flex; flex-wrap: wrap; gap: 16px; margin: 12px 4px 4px; font-size: 14px; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 14px; border-radius: 50%; vertical-align: -2px; margin-right: 7px; }
.legend .p { background: var(--proven); } .legend .b { border: 2px solid var(--built); background: linear-gradient(90deg, var(--built) 50%, transparent 50%); } .legend .t { border: 2px dashed var(--todo); }

.picker { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.picker button { font: 500 14px/1 var(--body); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 10px 14px; cursor: pointer; }
.picker button[aria-pressed="true"] { border-color: var(--orange); background: var(--orange-soft); }
.picker button:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }

.detail { margin-top: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
.detail h3 { font: 400 26px/1.05 var(--head); letter-spacing: .03em; margin: 0 0 4px; }
.chip { display: inline-block; font: 600 12px/1 var(--body); padding: 6px 9px; border-radius: 4px; margin-bottom: 10px; }
.chip.proven { background: var(--proven); color: var(--bg); } .chip.built { background: var(--built); color: var(--bg); } .chip.todo { background: transparent; color: var(--muted); border: 1px dashed var(--todo); }
.detail ul { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; }
.detail li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; background: var(--bg); }
.detail li:hover { border-color: var(--orange); }
.detail li span.d { width: 14px; height: 14px; border-radius: 50%; margin-top: 4px; }
.detail li .proven { background: var(--proven); } .detail li .built { border: 2px solid var(--built); background: linear-gradient(90deg, var(--built) 50%, transparent 50%); } .detail li .todo { border: 2px dashed var(--todo); }
.detail small { display: block; color: var(--muted); font-size: 13px; }
.next { margin-top: 28px; display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.next > div { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; min-width: 0; }
.next .who { font: 400 15px/1 var(--head); letter-spacing: .1em; color: var(--orange); margin-bottom: 8px; }
.next button { margin-top: 12px; font: 600 15px/1 var(--body); color: #fff; background: var(--orange); border: 0; border-radius: 8px; padding: 13px 18px; cursor: pointer; }
.next button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.note { margin-top: 36px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); max-width: 74ch; }
</style>

<div class="wrap">
  <img class="lockup on-dark" alt="BOB, Build Optimisation Buddy, by Step Change" src="data:image/png;base64,{{DARK}}">
  <img class="lockup on-light" alt="BOB, Build Optimisation Buddy, by Step Change" src="data:image/png;base64,{{LIGHT}}">

  <div class="buddy">
    <img alt="BOB the orange sponge character" src="data:image/png;base64,{{CHAR}}">
    <div>
      <h1>Hi, I'm BOB. Here's your project.</h1>
      <p><span id="proj"></span>: <b id="tally"></b> promises are proven.</p>
      <p><b>Next step:</b> <span id="nextline"></span></p>
      <p class="you">Tap any dot or branch to see it in plain words.</p>
    </div>
  </div>

  <div class="stage"><span class="now" id="round"></span></div>

  <h2>The map</h2>
  <p class="sub">Every branch is one part of the job. Every dot is one promise BOB made. Dots light up as they are proven.</p>
  <div class="mapbox"><svg id="map" viewBox="0 0 1000 640" role="img" aria-label="BOB project map: seven branches, each with dots for its promises"></svg></div>
  <div class="legend"><span><i class="p"></i>Proven</span><span><i class="b"></i>Built, never seen</span><span><i class="t"></i>Not started</span></div>
  <div class="picker" id="picker" role="group" aria-label="Pick a branch"></div>
  <div class="detail" id="detail" aria-live="polite"></div>

  <h2>Next step</h2>
  <div class="next"><div><div class="who" id="who"></div><p id="whotext"></p></div></div>

  <p class="note" id="note"></p>
</div>

<script>window.BOB_MAP = {{DATA}};</script>
<script>
const D = window.BOB_MAP;
const S = { proven: 'Proven', built: 'Built, never seen', todo: 'Not started' };
const BR = D.branches.map(b => ({ id: b.id, name: b.name, blurb: b.blurb, items: b.items.map(i => [i.state, i.label, i.plain]) }));
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('map');
const cx = 500, cy = 320, R1 = 178, R2 = 268;
const stepOf = n => (n > 1 ? Math.min(15, ((360 / BR.length) * 0.9) / (n - 1)) : 0);
let sel = { hub: BR[0].id, leaf: null };
const el = (n, a, p) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); (p || svg).appendChild(e); return e; };
const pt = (deg, r) => [cx + r * Math.cos(deg * Math.PI / 180), cy + r * Math.sin(deg * Math.PI / 180) * 0.92];

function draw() {
  svg.innerHTML = '';
  BR.forEach((b, i) => {
    const a = -90 + i * (360 / BR.length), [hx, hy] = pt(a, R1);
    el('line', { class: 'edge', x1: cx, y1: cy, x2: hx, y2: hy });
    const n = b.items.length;
    b.items.forEach((it, k) => {
      const [lx, ly] = pt(a + (k - (n - 1) / 2) * stepOf(n), R2);
      el('line', { class: 'edge', x1: hx, y1: hy, x2: lx, y2: ly });
    });
  });
  el('circle', { cx, cy, r: 58, fill: 'var(--bg)', stroke: 'var(--orange)', 'stroke-width': 3 });
  const im = el('image', { x: cx - 44, y: cy - 44, width: 88, height: 88 });
  im.setAttributeNS('http://www.w3.org/1999/xlink', 'href', document.querySelector('.buddy img').src); im.setAttribute('href', document.querySelector('.buddy img').src);
  BR.forEach((b, i) => {
    const a = -90 + i * (360 / BR.length), [hx, hy] = pt(a, R1);
    const done = b.items.filter(x => x[0] === 'proven').length;
    const g = el('g', { class: 'hub' + (sel.hub === b.id && !sel.leaf ? ' sel' : ''), tabindex: 0, role: 'button', 'aria-label': `${b.name}, ${done} of ${b.items.length} proven` });
    el('rect', { x: hx - 68, y: hy - 22, width: 136, height: 44, rx: 22 }, g);
    const t = el('text', { x: hx, y: hy - 5 }, g); t.textContent = b.name;
    const c = el('text', { x: hx, y: hy + 11, class: 'count' }, g); c.textContent = `${done} of ${b.items.length} proven`;
    g.onclick = () => pick(b.id, null); g.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(b.id, null); } };
    const n = b.items.length;
    b.items.forEach((it, k) => {
      const [lx, ly] = pt(a + (k - (n - 1) / 2) * stepOf(n), R2);
      const lg = el('g', { class: `leaf ${it[0]}` + (sel.leaf === `${b.id}:${k}` ? ' sel' : ''), tabindex: 0, role: 'button', 'aria-label': `${it[1]}: ${S[it[0]]}` });
      el('title', {}, lg).textContent = it[1];
      el('circle', { cx: lx, cy: ly, r: 17 }, lg);
      if (it[0] === 'proven') el('path', { class: 'tick', d: `M${lx - 7} ${ly} l5 6 l9 -11` }, lg);
      if (it[0] === 'built') el('path', { d: `M${lx} ${ly - 11} a11 11 0 0 0 0 22 z` }, lg);
      lg.onclick = () => pick(b.id, `${b.id}:${k}`); lg.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(b.id, `${b.id}:${k}`); } };
    });
  });
}
function renderDetail() {
  const b = BR.find(x => x.id === sel.hub), d = document.getElementById('detail');
  if (sel.leaf) {
    const k = +sel.leaf.split(':')[1], it = b.items[k];
    d.innerHTML = `<span class="chip ${it[0]}">${S[it[0]]}</span><h3></h3><p></p><p class="sub">Part of: ${b.name}</p>`;
    d.querySelector('h3').textContent = it[1]; d.querySelector('p').textContent = it[2];
    return;
  }
  d.innerHTML = `<h3></h3><p class="sub"></p><ul></ul>`;
  d.querySelector('h3').textContent = b.name; d.querySelector('.sub').textContent = b.blurb;
  const ul = d.querySelector('ul');
  b.items.forEach((it, k) => {
    const li = document.createElement('li'); li.tabIndex = 0;
    li.innerHTML = `<span class="d ${it[0]}"></span><div><strong></strong><small></small></div>`;
    li.querySelector('strong').textContent = it[1]; li.querySelector('small').textContent = `${S[it[0]]}. ${it[2]}`;
    li.onclick = () => pick(b.id, `${b.id}:${k}`); li.onkeydown = e => { if (e.key === 'Enter') pick(b.id, `${b.id}:${k}`); };
    ul.appendChild(li);
  });
}
function renderPicker() {
  const p = document.getElementById('picker'); p.innerHTML = '';
  BR.forEach(b => { const x = document.createElement('button'); x.type = 'button'; x.textContent = b.name; x.setAttribute('aria-pressed', String(sel.hub === b.id)); x.onclick = () => pick(b.id, null); p.appendChild(x); });
}
function pick(h, l) { sel = { hub: h, leaf: l }; draw(); renderDetail(); renderPicker(); }
document.getElementById('proj').textContent = D.project;
document.getElementById('tally').textContent = D.proven + ' of ' + D.total;
document.getElementById('nextline').textContent = ({ 'ASH NEEDS TO': 'Ash needs to', 'CLAUDE': 'Claude' }[D.next.doer] || D.next.doer) + ': ' + D.next.text;
document.getElementById('round').textContent = D.round;
document.getElementById('who').textContent = D.next.doer;
document.getElementById('whotext').textContent = D.next.text;
document.getElementById('note').textContent = 'Written by BOB from the project ledger at ' + D.generatedAt + '. Every dot is one requirement; none is set by hand. No percentage is shown. Logo and character are the approved BOB files, resized only.';
pick(BR[0].id, null);
</script>
