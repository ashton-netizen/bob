# BOB required checks. Each job must be made a required status check on main
# (branch protection) and each must be seen RED once against its own bug before
# it counts (docs/product/product-plan.md, Part 3). Unrun until pushed.
name: gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  secret-scan:
    name: secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    # The action reads the pull request's commits through the API; without this
    # the default token gets 403 (seen red for the wrong reason, 21 October 2026).
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  personal-data:
    name: no personal or client data in Claude files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: grep for email addresses and phone numbers in CLAUDE.md, .claude/, bob/, fixtures/, templates/
        # The phone pattern is bounded by non-hex characters so a sha256 fingerprint
        # (bob/sources.json) cannot read as a number (seen red on pull request 24).
        run: |
          set -e
          hits=$(grep -rnIE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}|(^|[^0-9A-Fa-f])(\+?61|0)[2-9][0-9 ]{8,}([^0-9A-Fa-f]|$)' CLAUDE.md .claude bob fixtures templates 2>/dev/null || true)
          if [ -n "$hits" ]; then echo "$hits"; echo "personal data found in Claude files"; exit 1; fi
          echo "clean"

  no-runtime-babel:
    name: no runtime Babel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if grep -rIl --include='*.html' --include='*.htm' --include='*.js' --include='*.jsx' --include='*.ts' --include='*.tsx' --exclude-dir=references --exclude-dir=.git 'text/babel' .; then echo "runtime Babel found"; exit 1; fi
          echo "clean"

  plugin:
    name: plugin validate and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      # Version floor 2.1.304: the Text prop "weight" the pane uses is refused by
      # 2.1.287 (seen on Ash's Mac, 21 October 2026). Print what CI got.
      - run: claude --version
      # OPEN: whether `claude plugin validate` and `claude plugin test` run without a login
      # in CI is not yet verified. Build 1 step 1 confirms it; if they need auth, this job
      # is split and the auth route recorded in docs/handoff.md. Never put a key here.
      - name: validate (the spike's test is archived; see plugin-spike/README.md)
        run: |
          claude plugin validate ./plugin-spike
          claude plugin validate .
      - name: test
        run: claude plugin test .

  schema-and-fixtures:
    name: schema and fixtures parse and agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I scripts/check_fixtures.py
      - name: design-room fixture passes its shape check
        run: python3 -I skills/design-with-bob/references/check_design_room.py --synthetic fixtures/design-room
      - name: preflight STOP conditions, one failing case each
        run: bash scripts/preflight.test.sh
